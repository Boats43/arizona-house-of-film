<!doctype html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ✅ Base SEO -->
  <title>Arizona Window Film & Tinting Phoenix | ROC #314088 | Arizona House of Film</title>
  <meta name="description" content="Arizona House of Film provides residential and commercial window tinting in Phoenix, Scottsdale & statewide. Licensed ROC #314088. 4.4★ rated. Free estimates available." />
  <meta name="robots" content="index, follow" />

  <!-- ✅ Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />

  <!-- ✅ Canonical -->
  <link rel="canonical" href="https://arizonahouseoffilm.com/" />

  <!-- 🔥 Non-blocking Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap"
    />
  </noscript>

  <!-- 🔥 Preload Hero Image (MUST be public path, not local path) -->
  <link
    rel="preload"
    as="image"
    href="/images/phoenix-window-tinting.webp"
    fetchpriority="high"
  />

  <!-- Prevent layout shift before hydration -->
  <style>
    body {
      margin: 0;
    }

    /* Reserve header height */
    #header-reserve {
      height: 80px;
    }

    /* Reserve hero space */
    #hero-reserve {
      width: 100%;
      aspect-ratio: 1600 / 1066;
      background: #111;
    }

    /* Prevent white flash */
    #root:empty {
      min-height: 100vh;
    }
  </style>

  <!-- Vite entry (Dev Mode) -->
  <script type="module" src="/src/main.jsx"></script>

</head>

<body>

  <!-- Header space reservation -->
  <div id="header-reserve"></div>

  <!-- Hero space reservation -->
  <div id="hero-reserve"></div>

  <!-- React root -->
  <div id="root"></div>

  <script>
    // Remove reserves after React mounts
    const observer = new MutationObserver(() => {
      const root = document.getElementById("root");
      if (root && root.children.length > 0) {
        document.getElementById("header-reserve")?.remove();
        document.getElementById("hero-reserve")?.remove();
        observer.disconnect();
      }
    });

    observer.observe(document.getElementById("root"), { childList: true });
  </script>

</body>
</html>
