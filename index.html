<!doctype html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Phoenix Window Tinting | Residential & Commercial Experts</title>
  <meta name="description" content="Professional residential and commercial window tinting in Phoenix. Licensed, Bonded, and Insured ROC #315259." />

  <!-- 🔥 Non-blocking Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap"
    />
  </noscript>

  <!-- 🔥 Preload Hero Image -->
  <link
    rel="preload"
    as="image"
    href="https://horizons-cdn.hostinger.com/500f9a0e-19d5-4ed7-98ea-cc353ce878bb/phoenix-window-tinting-sQw5T.jpg"
    fetchpriority="high"
  />

  <style>
    /* Prevent default margin */
    body {
      margin: 0;
    }

    /* Reserve header height before React loads */
    #header-reserve {
      height: 80px;
    }

    /* 🔥 Reserve hero space WITHOUT loading image twice */
    #hero-reserve {
      width: 100%;
      aspect-ratio: 1600 / 1066;
      background: #111;
    }

    /* Prevent white flash before hydration */
    #root:empty {
      min-height: 100vh;
    }
  </style>

  <!-- Vite entry -->
  <script type="module" src="/src/main.jsx"></script>
</head>

<body>

  <!-- Header space reservation -->
  <div id="header-reserve"></div>

  <!-- Hero space reservation -->
  <div id="hero-reserve"></div>

  <!-- React root -->
  <div id="root"></div>

  <script>
    // Remove reserves after React mounts
    const observer = new MutationObserver(() => {
      const root = document.getElementById("root");
      if (root && root.children.length > 0) {
        document.getElementById("header-reserve")?.remove();
        document.getElementById("hero-reserve")?.remove();
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById("root"), { childList: true });
  </script>

</body>
</html>
