<!doctype html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Phoenix Window Tinting | Residential & Commercial Experts</title>
  <meta name="description" content="Professional residential and commercial window tinting in Phoenix. Licensed, Bonded, and Insured ROC #315259." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet" />

  <!-- Preload Hero -->
  <link
    rel="preload"
    as="image"
    href="https://horizons-cdn.hostinger.com/500f9a0e-19d5-4ed7-98ea-cc353ce878bb/phoenix-window-tinting-sQw5T.jpg"
    fetchpriority="high"
  />

  <style>
    /* 🔥 CRITICAL: Reserve header height BEFORE React loads */
    body {
      margin: 0;
    }

    #header-reserve {
      height: 80px; /* matches h-20 */
    }

    /* 🔥 Reserve hero space to prevent CLS */
    #hero-reserve {
      width: 100%;
      aspect-ratio: 1600 / 1066;
      background: #111 url("https://horizons-cdn.hostinger.com/500f9a0e-19d5-4ed7-98ea-cc353ce878bb/phoenix-window-tinting-sQw5T.jpg") center/cover no-repeat;
    }

    #root:empty {
      min-height: 100vh;
    }
  </style>

  <script type="module" src="/src/main.jsx"></script>
</head>

<body>

  <!-- Header Space Reservation -->
  <div id="header-reserve"></div>

  <!-- Hero Space Reservation -->
  <div id="hero-reserve"></div>

  <!-- React Root -->
  <div id="root"></div>

  <script>
    // Remove reserves AFTER React mounts (without collapsing layout)
    const observer = new MutationObserver(() => {
      const root = document.getElementById("root");
      if (root && root.children.length > 0) {
        document.getElementById("header-reserve")?.remove();
        document.getElementById("hero-reserve")?.remove();
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById("root"), { childList: true });
  </script>

</body>
</html>
