<!doctype html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-MC2PDPFR');</script>
  <!-- End Google Tag Manager -->

  <!-- ✅ Base SEO — title and description are set per-page by react-helmet-async -->
  <meta name="robots" content="index, follow" />

  <!-- ✅ Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
  <link rel="manifest" href="/site.webmanifest" />


  <!-- 🔥 Non-blocking Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=optional"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=optional"
    />
  </noscript>

  <!-- Size-adjust fallback to minimize layout shift if Inter loads late -->
  <style>
    @font-face {
      font-family: 'Inter Fallback';
      src: local('Arial');
      size-adjust: 107%;
      ascent-override: 90%;
      descent-override: 22%;
      line-gap-override: 0%;
    }
  </style>

  <!-- 🔥 Preload Hero Image (MUST be public path, not local path) -->
  <link
    rel="preload"
    as="image"
    href="/images/phoenix-window-tinting.webp"
    fetchpriority="high"
  />

  <!-- Prevent layout shift before hydration -->
  <style>
    body {
      margin: 0;
    }

    /* Reserve space for FloatingContactButton on mobile to prevent CLS */
    @media (max-width: 1024px) {
      body {
        padding-bottom: 60px;
      }
    }

    /* Prevent white flash */
    #root:empty {
      min-height: 100vh;
    }
  </style>

  <!-- Vite entry (Dev Mode) -->
  <script type="module" src="/src/main.jsx"></script>

</head>

<body>

  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MC2PDPFR"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <!-- React root -->
  <div id="root"></div>

</body>
</html>
